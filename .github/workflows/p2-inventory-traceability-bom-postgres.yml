              md5((SELECT string_agg(id::text||':'||COALESCE(payload,''),',' ORDER BY id) FROM labor_entries)) labor_digest,
              md5((SELECT string_agg(id::text||':'||COALESCE(payload,''),',' ORDER BY id) FROM project_received_materials)) material_digest,
              md5((SELECT string_agg(id::text||':'||COALESCE(payload,''),',' ORDER BY id) FROM genealogy_records)) genealogy_digest) after_state;
            IF changed THEN RAISE EXCEPTION 'Historical counts or checksums changed'; END IF;
          END $$;
          TABLE before_state;
          DO $$ BEGIN IF (SELECT count(*) FROM inventory_item_traceability_policies)<>0 THEN RAISE EXCEPTION 'Historical traceability was inferred'; END IF; END $$;
          INSERT INTO inventory_item_traceability_policies
            (inventory_item_id,revision_number,status,policy_type,item_classification,part_configuration_revision,
             unit_of_measure,quantity_entry_required,content_checksum,created_by_display_name,created_by_role,
             approved_by_display_name,approved_by_role,approval_capacity,signature_meaning,approved_at)
          VALUES(1,1,'RELEASED','STANDARD_QUANTITY','ASSEMBLY','A','EA',true,'checksum','Creator','ENGINEERING','Approver','QUALITY','QUALITY','I approve',now());
          DO $$ DECLARE blocked boolean := false; BEGIN
            BEGIN
              UPDATE inventory_item_traceability_policies SET unit_of_measure='LB' WHERE inventory_item_id=1;
            EXCEPTION WHEN raise_exception THEN blocked := true;
            END;
            IF NOT blocked THEN RAISE EXCEPTION 'Released policy mutation was not blocked'; END IF;
          END $$;
          UPDATE boms SET parent_inventory_item_id=1,parent_part_number_snapshot='LEGACY-PARENT',parent_name_snapshot='Legacy Parent',parent_revision_snapshot='B' WHERE code='LEGACY-BOM';
          INSERT INTO bom_revisions(bom_id,rev_code,is_released,lifecycle_status,effectivity,content_checksum,
            approved_by_display_name,approved_by_role,approval_capacity,signature_meaning,approved_at)
          SELECT id,'B',false,'DRAFT','{"revision":"B"}'::jsonb,'bom-checksum','BOM Approver','ENGINEERING','ENGINEERING','I approve',now() FROM boms WHERE code='LEGACY-BOM';
          INSERT INTO bom_lines(revision_id,child_part_ag_number,qty_per,child_inventory_item_id,
            child_part_number_snapshot,child_name_snapshot,child_revision_snapshot,unit_of_measure,
            make_buy_disposition,assembly_path_identity,inherited_policy_id,inherited_policy_revision,inherited_policy_type)
          SELECT br.id,'LEGACY-CHILD',1,2,'LEGACY-CHILD','Legacy Child','A','EA','BUY','1/2',p.id,p.revision_number,p.policy_type
          FROM bom_revisions br JOIN boms b ON b.id=br.bom_id
          JOIN inventory_item_traceability_policies p ON p.inventory_item_id=1 AND p.status='RELEASED'
          WHERE b.code='LEGACY-BOM' AND br.rev_code='B';
          UPDATE bom_revisions SET lifecycle_status='RELEASED',is_released=true WHERE rev_code='B';
          DO $$ DECLARE revision_blocked boolean := false; line_blocked boolean := false; BEGIN
            BEGIN UPDATE bom_revisions SET rev_code='C' WHERE lifecycle_status='RELEASED'; EXCEPTION WHEN raise_exception THEN revision_blocked := true; END;
            BEGIN UPDATE bom_lines SET qty_per=2 WHERE revision_id IN(SELECT id FROM bom_revisions WHERE lifecycle_status='RELEASED'); EXCEPTION WHEN raise_exception THEN line_blocked := true; END;
            IF NOT revision_blocked OR NOT line_blocked THEN RAISE EXCEPTION 'Released BOM snapshot mutation was not blocked'; END IF;
          END $$;
          BEGIN;
          INSERT INTO inventory_item_traceability_policies
            (inventory_item_id,revision_number,policy_type,item_classification,part_configuration_revision,
             unit_of_measure,quantity_entry_required,content_checksum,created_by_display_name,created_by_role)
          VALUES(2,1,'STANDARD_QUANTITY','PURCHASED_COMPONENT','A','EA',true,'rollback','Creator','ENGINEERING');
          ROLLBACK;
          DO $$ BEGIN IF EXISTS(SELECT 1 FROM inventory_item_traceability_policies WHERE content_checksum='rollback') THEN RAISE EXCEPTION 'Rollback failed'; END IF; END $$;
          SQL
      - name: Prove flags remain opt-in
        run: |
          test -z "${INVENTORY_TRACEABILITY_POLICY_READS_ENABLED:-}"
          test -z "${INVENTORY_TRACEABILITY_POLICY_WRITES_ENABLED:-}"
          test -z "${CONTROLLED_ITEM_LINKED_BOM_READS_ENABLED:-}"
          test -z "${CONTROLLED_ITEM_LINKED_BOM_WRITES_ENABLED:-}"
          test -z "${P2_CONFIGURATION_BOM_INTEGRATION_ENABLED:-}"
          test -z "${RECURSIVE_TRACEABILITY_PREVIEW_ENABLED:-}"
          test -z "${VITE_INVENTORY_TRACEABILITY_POLICY_READS_ENABLED:-}"
          test -z "${VITE_INVENTORY_TRACEABILITY_POLICY_WRITES_ENABLED:-}"
