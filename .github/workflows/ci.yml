name: CI - TypeScript & Code Quality Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
          
      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check (advisory only)
        run: npm run check
        continue-on-error: true

      - name: Run ESLint (advisory only)
        run: npm run lint
        continue-on-error: true

      - name: Check Prettier formatting (advisory only)
        run: npx prettier --check "client/**/*.{js,jsx,ts,tsx}" "server/**/*.{js,jsx,ts,tsx}" "shared/**/*.{js,jsx,ts,tsx}" "*.{js,ts,json,md}"
        continue-on-error: true

      - name: Build check (REQUIRED)
        run: npm run build

  security-audit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Security audit
        run: npm audit --production --audit-level=moderate
        continue-on-error: true
