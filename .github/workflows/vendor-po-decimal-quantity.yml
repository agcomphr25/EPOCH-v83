name: Vendor PO Decimal Quantity Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  vendor-po-decimal-quantity:
    name: Vendor PO decimal quantity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify decimal quantity behavior and policy
        run: >
          npx vitest run
          --config vitest.config.client.ts
          client/src/__tests__/vendorPOQuantity.test.ts
          client/src/__tests__/vendorPOQuantityPolicy.test.ts
