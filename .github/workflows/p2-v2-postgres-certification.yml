name: P2 V2 PostgreSQL certification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/p2-v2-postgres-certification.yml'
      - '.github/p2-v2-phase10a-static-manifest.json'
      - 'migrations/**'
      - 'server/schema.ts'
      - 'server/scripts/migrations/runSafeBootMigrations.ts'
      - 'server/src/lib/featureFlags.ts'
      - 'server/src/services/projectPreproductionReadinessService.ts'
      - 'server/src/services/projectProductionExecutionService.ts'
      - 'server/src/services/projectQualityReleaseService.ts'
      - 'server/src/services/projectShippingCloseoutService.ts'
      - 'server/src/services/projectShippingCloseoutRules.ts'
      - 'server/src/services/projectPilotControlService.ts'
      - 'server/src/routes/projectPilotControl.ts'
      - 'server/src/routes/projectShippingCloseout.ts'
      - 'server/src/routes/projects.ts'
      - 'server/src/routes/travelers.ts'
      - 'server/src/routes/workOrders.ts'
      - 'server/storage.ts'
      - 'server/__tests__/p2V2PostgresCertification.test.ts'
      - 'server/__tests__/p2V2PilotPostgresCertification.test.ts'
      - 'client/src/__tests__/P2V2*.component.test.tsx'
      - 'scripts/validate-phase10a-static-manifest.js'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: p2-v2-postgres-certification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: epoch_cert
          POSTGRES_PASSWORD: epoch_cert_password
          POSTGRES_DB: epoch_p2_v2_certification
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U epoch_cert -d epoch_p2_v2_certification"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://epoch_cert:epoch_cert_password@127.0.0.1:5432/epoch_p2_v2_certification
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out exact main baseline for TypeScript comparison
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: phase10a-main-baseline

      - name: Isolate the TypeScript baseline checkout
        run: mv phase10a-main-baseline /tmp/phase10a-main-baseline

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install committed dependencies
        run: npm ci --ignore-scripts

      - name: Run bounded full TypeScript certification
        shell: bash
        run: |
          set +e
          start_head=$(date +%s)
          NODE_OPTIONS=--max-old-space-size=6144 npx tsc --noEmit --pretty false \
            > /tmp/phase10a-head-tsc.log 2>&1
          head_exit=$?
          head_duration=$(($(date +%s) - start_head))
          head_diagnostics=$(grep -c "error TS[0-9]" /tmp/phase10a-head-tsc.log || true)
          echo "head: heap_mb=6144 duration_seconds=${head_duration} exit_code=${head_exit} diagnostics=${head_diagnostics}"
          if [ "$head_exit" -eq 0 ]; then
            exit 0
          fi

          ln -s "$GITHUB_WORKSPACE/node_modules" \
            "/tmp/phase10a-main-baseline/node_modules"
          pushd "/tmp/phase10a-main-baseline"
          start_base=$(date +%s)
          NODE_OPTIONS=--max-old-space-size=6144 "$GITHUB_WORKSPACE/node_modules/.bin/tsc" \
            --noEmit --pretty false > /tmp/phase10a-base-tsc.log 2>&1
          base_exit=$?
          base_duration=$(($(date +%s) - start_base))
          popd
          base_diagnostics=$(grep -c "error TS[0-9]" /tmp/phase10a-base-tsc.log || true)
          echo "base: heap_mb=6144 duration_seconds=${base_duration} exit_code=${base_exit} diagnostics=${base_diagnostics}"
          if [ "$base_exit" -eq 0 ]; then
            echo "Corrective branch introduced TypeScript diagnostics."
            exit "$head_exit"
          fi
          sed -E \
            -e "s#$GITHUB_WORKSPACE/##g" \
            -e 's#/tmp/phase10a-main-baseline/##g' \
            -e 's/\([0-9]+,[0-9]+\):/:/' \
            /tmp/phase10a-head-tsc.log | sort > /tmp/phase10a-head-tsc.normalized
          sed -E \
            -e "s#$GITHUB_WORKSPACE/##g" \
            -e 's#/tmp/phase10a-main-baseline/##g' \
            -e 's/\([0-9]+,[0-9]+\):/:/' \
            /tmp/phase10a-base-tsc.log | sort > /tmp/phase10a-base-tsc.normalized
          if ! cmp -s /tmp/phase10a-head-tsc.normalized /tmp/phase10a-base-tsc.normalized; then
            echo "Corrective branch TypeScript diagnostics differ from exact main."
            diff --unified /tmp/phase10a-base-tsc.normalized /tmp/phase10a-head-tsc.normalized || true
            exit 1
          fi
          echo "Corrective branch introduces no TypeScript diagnostic beyond exact main."
          exit 0

      - name: Run focused Phase 9-10A ESLint certification
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          node scripts/validate-phase10a-static-manifest.js
          mapfile -t manifest_files < <(
            node -e 'for (const file of require("./.github/p2-v2-phase10a-static-manifest.json")) console.log(file)'
          )
          mapfile -t corrective_files < <(
            git diff --name-only "$BASE_SHA"...HEAD |
              grep -E '\.(js|jsx|ts|tsx)$' || true
          )
          mapfile -t files < <(
            printf '%s\n' "${manifest_files[@]}" "${corrective_files[@]}" | sort -u
          )
          start=$(date +%s)
          npx eslint --max-warnings 0 "${files[@]}"
          echo "focused_eslint: manifest_files=${#manifest_files[@]} corrective_files=${#corrective_files[@]} unique_files=${#files[@]} duration_seconds=$(($(date +%s) - start)) exit_code=0 errors=0 warnings=0"

      - name: Run focused Phase 9-10A formatting certification
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          node scripts/validate-phase10a-static-manifest.js
          mapfile -t files < <(
            node -e 'for (const file of require("./.github/p2-v2-phase10a-static-manifest.json")) console.log(file)'
          )
          npx prettier --check "${files[@]}"
          mapfile -t corrective_files < <(
            git diff --name-only "$BASE_SHA"...HEAD |
              grep -E '\.(js|jsx|ts|tsx|json|css|md|ya?ml)$' || true
          )
          if [ "${#corrective_files[@]}" -eq 0 ]; then
            echo "No Prettier-supported corrective files found."
            exit 1
          fi
          npx prettier --check "${corrective_files[@]}"
          git diff --check "$BASE_SHA"...HEAD
          echo "formatting: manifest_files=${#files[@]} corrective_files=${#corrective_files[@]} exit_code=0"

      - name: Create schema-push prerequisite
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE SEQUENCE rts_item_number_seq"

      - name: Create current application schema
        run: npx drizzle-kit push --force --config drizzle.app.config.ts

      - name: Restore migration-only schema baseline
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/0069_timekeeping_schema.sql

      - name: First safe-boot migration run
        env:
          SAFE_BOOT_MIGRATIONS_ONLY: 'true'
        run: npm run maintenance:safe-migrations

      - name: Capture first-run schema
        run: >-
          pg_dump "$DATABASE_URL" --schema-only --no-owner --no-privileges |
          sed '/^\\\(un\)\?restrict /d' > /tmp/schema-first.sql

      - name: Second safe-boot migration run
        env:
          SAFE_BOOT_MIGRATIONS_ONLY: 'true'
        run: npm run maintenance:safe-migrations

      - name: Prove second-run schema idempotency
        run: |
          pg_dump "$DATABASE_URL" --schema-only --no-owner --no-privileges |
            sed '/^\\\(un\)\?restrict /d' > /tmp/schema-second.sql
          diff --unified /tmp/schema-first.sql /tmp/schema-second.sql

      - name: Run isolated PostgreSQL certification
        env:
          P2_V2_PRODUCTION_LAUNCH_ENABLED: 'true'
        run: >-
          npx vitest run
          --config vitest.config.server.ts
          server/__tests__/p2V2PostgresCertification.test.ts
          --reporter=verbose

      - name: Run controlled pilot PostgreSQL certification
        env:
          P2_V2_PILOT_ENVIRONMENT: isolated_test
        run: >-
          npx vitest run
          --config vitest.config.server.ts
          server/__tests__/p2V2PilotPostgresCertification.test.ts
          --reporter=verbose

      - name: Run Phase 1-9 focused server regressions
        run: >-
          npx vitest run
          --config vitest.config.server.ts
          server/__tests__/projectCommercialReview.test.ts
          server/__tests__/projectTechnicalConfigurationReview.test.ts
          server/__tests__/projectProductionPlanning.test.ts
          server/__tests__/projectWadAuthorization.test.ts
          server/__tests__/projectPreproductionReadiness.test.ts
          server/__tests__/projectProductionExecution.test.ts
          server/__tests__/projectQualityRelease.test.ts
          server/__tests__/projectShippingCloseout.test.ts
          server/__tests__/p2V2ProductionLaunchFeatureGate.test.ts
          --reporter=verbose

      - name: Run P2 V2 ten-stage component regressions
        run: >-
          npx vitest run
          --config vitest.config.client.ts
          client/src/__tests__/P2V2ProjectWorkflow.component.test.tsx
          client/src/__tests__/P2V2ProductionPlanning.component.test.tsx
          client/src/__tests__/P2V2WadAuthorization.component.test.tsx
          client/src/__tests__/P2V2PreproductionReadiness.component.test.tsx
          client/src/__tests__/P2V2ProductionExecution.component.test.tsx
          client/src/__tests__/P2V2QualityProductRelease.component.test.tsx
          client/src/__tests__/P2V2ShippingProjectCloseout.component.test.tsx
          client/src/__tests__/P2V2PilotControlCenter.component.test.tsx
          --reporter=verbose
