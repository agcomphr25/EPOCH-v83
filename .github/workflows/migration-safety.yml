name: Migration Safety Tests

on:
  pull_request:
    branches:
      - '**'

jobs:
  migration-safety:
    name: Run migration safety test suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_db

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Grant CREATEDB privilege to CI user
        run: |
          psql "$DATABASE_URL" -c "ALTER USER ci_user CREATEDB;"

      - name: Push Drizzle schema to CI database
        run: npx drizzle-kit push --force
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run migration safety tests
        run: npx vitest run --config vitest.config.server.ts server/__tests__/migrationSafety.test.ts
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
