kind = "web"
previewPath = "/"
title = "Timekeeper"
version = "1.0.0"
id = "artifacts/timekeeper"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20904

[services.development]
run = "pnpm --filter @workspace/timekeeper run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/timekeeper", "run", "build" ]
publicDir = "artifacts/timekeeper/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20904"
BASE_PATH = "/"
