name: P2 V2 PostgreSQL certification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/p2-v2-postgres-certification.yml'
      - '.github/p2-v2-phase10a-static-manifest.json'
      - '.github/p2-v2-workflow-dispatch-certification-manifest.json'
      - 'migrations/**'
      - 'server/schema.ts'
      - 'server/src/routes/qmsDesignControl.ts'
      - 'server/src/services/designControlApprovalService.ts'
      - 'server/src/services/designControlAuthorityService.ts'
      - 'server/src/services/designManufacturingEvidenceService.ts'
      - 'server/src/services/designHistoryFileService.ts'
      - 'server/src/services/engineeringReleaseService.ts'
      - 'server/src/routes/engineeringChangeRequests.ts'
      - 'server/src/routes/engineeringChangeNotices.ts'
      - 'server/src/services/engineeringChangeRequestService.ts'
      - 'server/src/services/engineeringChangeNoticeService.ts'
      - 'client/src/features/design-control/**'
      - 'client/src/components/design-control/**'
      - 'client/src/pages/QMSDesignControlPage.tsx'
      - 'shared/designControlWorkflow.ts'
      - 'shared/designControlFormCatalog.ts'
      - 'shared/designHistoryFileManifest.ts'
      - 'server/__tests__/designControl*.test.ts'
      - 'server/__tests__/designHistoryFiles.test.ts'
      - 'server/__tests__/engineeringChange*.test.ts'
      - 'server/__tests__/qmsDesignControlReleaseGate.test.ts'
      - 'client/src/__tests__/designControl*.test.ts'
      - 'client/src/__tests__/DesignProjectConfigurationWorkspace.component.test.tsx'
      - 'docs/design-control/**'
      - 'server/scripts/migrations/runSafeBootMigrations.ts'
      - 'server/src/lib/featureFlags.ts'
      - 'server/src/services/projectPreproductionReadinessService.ts'
      - 'server/src/services/projectProductionExecutionService.ts'
      - 'server/src/services/projectQualityReleaseService.ts'
      - 'server/src/services/projectShippingCloseoutService.ts'
      - 'server/src/services/projectShippingCloseoutRules.ts'
      - 'server/src/services/projectPilotControlService.ts'
      - 'server/src/routes/projectPilotControl.ts'
      - 'server/src/routes/projectShippingCloseout.ts'
      - 'server/src/routes/projects.ts'
      - 'server/src/routes/travelers.ts'
      - 'server/src/routes/workOrders.ts'
      - 'server/storage.ts'
      - 'server/__tests__/p2V2PostgresCertification.test.ts'
      - 'server/__tests__/p2V2LegacyPreservationPostgres.test.ts'
      - 'server/__tests__/p2V2PilotPostgresCertification.test.ts'
      - 'server/__tests__/projectWorkflowVersion.test.ts'
      - 'server/__tests__/projectWorkflowRegistry.test.ts'
      - 'server/__tests__/projectWorkflowInstance.test.ts'
      - 'server/__tests__/projectWorkflowV2ReadModel.test.ts'
      - 'server/__tests__/projectClosingGate.test.ts'
      - 'client/src/__tests__/P2V2*.component.test.tsx'
      - 'scripts/validate-phase10a-static-manifest.js'
      - 'scripts/resolve-p2-v2-certification-scope.mjs'
      - 'scripts/resolve-p2-v2-certification-scope.test.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: p2-v2-postgres-certification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: epoch_cert
          POSTGRES_PASSWORD: epoch_cert_password
          POSTGRES_DB: epoch_p2_v2_certification
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U epoch_cert -d epoch_p2_v2_certification"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://epoch_cert:epoch_cert_password@127.0.0.1:5432/epoch_p2_v2_certification
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out exact main baseline for TypeScript comparison
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: phase10a-main-baseline

      - name: Isolate the TypeScript baseline checkout
        run: mv phase10a-main-baseline /tmp/phase10a-main-baseline

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install committed dependencies
        run: npm ci --ignore-scripts

      - name: Validate certification scope selection
        run: node --test scripts/resolve-p2-v2-certification-scope.test.mjs

      - name: Run bounded full TypeScript certification
        shell: bash
        run: |
          set +e
          start_head=$(date +%s)
          NODE_OPTIONS=--max-old-space-size=6144 npx tsc --noEmit --pretty false \
            > /tmp/phase10a-head-tsc.log 2>&1
          head_exit=$?
          head_duration=$(($(date +%s) - start_head))
          head_diagnostics=$(grep -c "error TS[0-9]" /tmp/phase10a-head-tsc.log || true)
          echo "head: heap_mb=6144 duration_seconds=${head_duration} exit_code=${head_exit} diagnostics=${head_diagnostics}"
          if [ "$head_exit" -eq 0 ]; then
            exit 0
          fi

          ln -s "$GITHUB_WORKSPACE/node_modules" \
            "/tmp/phase10a-main-baseline/node_modules"
          pushd "/tmp/phase10a-main-baseline"
          start_base=$(date +%s)
          NODE_OPTIONS=--max-old-space-size=6144 "$GITHUB_WORKSPACE/node_modules/.bin/tsc" \
            --noEmit --pretty false > /tmp/phase10a-base-tsc.log 2>&1
          base_exit=$?
          base_duration=$(($(date +%s) - start_base))
          popd
          base_diagnostics=$(grep -c "error TS[0-9]" /tmp/phase10a-base-tsc.log || true)
          echo "base: heap_mb=6144 duration_seconds=${base_duration} exit_code=${base_exit} diagnostics=${base_diagnostics}"
          if [ "$base_exit" -eq 0 ]; then
            echo "Corrective branch introduced TypeScript diagnostics."
            exit "$head_exit"
          fi
          sed -E \
            -e "s#$GITHUB_WORKSPACE/##g" \
            -e 's#/tmp/phase10a-main-baseline/##g' \
            -e 's/\([0-9]+,[0-9]+\):/:/' \
            /tmp/phase10a-head-tsc.log | sort > /tmp/phase10a-head-tsc.normalized
          sed -E \
            -e "s#$GITHUB_WORKSPACE/##g" \
            -e 's#/tmp/phase10a-main-baseline/##g' \
            -e 's/\([0-9]+,[0-9]+\):/:/' \
            /tmp/phase10a-base-tsc.log | sort > /tmp/phase10a-base-tsc.normalized
          comm -13 \
            /tmp/phase10a-base-tsc.normalized \
            /tmp/phase10a-head-tsc.normalized \
            > /tmp/phase10a-new-tsc-diagnostics
          if [ -s /tmp/phase10a-new-tsc-diagnostics ]; then
            echo "Corrective branch introduces TypeScript diagnostics beyond exact main."
            cat /tmp/phase10a-new-tsc-diagnostics
            exit 1
          fi
          removed_diagnostics=$(comm -23 \
            /tmp/phase10a-base-tsc.normalized \
            /tmp/phase10a-head-tsc.normalized | wc -l)
          echo "Corrective branch removed ${removed_diagnostics} baseline TypeScript diagnostic(s)."
          echo "Corrective branch introduces no TypeScript diagnostic beyond exact main."
          exit 0

      - name: Run focused Phase 9-10A ESLint certification
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node scripts/validate-phase10a-static-manifest.js
          mapfile -t manifest_files < <(
            node -e 'for (const file of require("./.github/p2-v2-phase10a-static-manifest.json")) console.log(file)'
          )
          mapfile -t corrective_files < <(
            node scripts/resolve-p2-v2-certification-scope.mjs \
              --event "$EVENT_NAME" --base "$BASE_SHA" --kind eslint
          )
          mapfile -t files < <(
            printf '%s\n' "${manifest_files[@]}" "${corrective_files[@]}" | sort -u
          )
          start=$(date +%s)
          npx eslint --max-warnings 0 "${manifest_files[@]}"
          set +e
          npx eslint --format json "${corrective_files[@]}" \
            > /tmp/phase10a-head-eslint.json 2>/tmp/phase10a-head-eslint.stderr
          head_eslint_exit=$?
          mapfile -t baseline_files < <(
            for file in "${corrective_files[@]}"; do
              if [ -f "/tmp/phase10a-main-baseline/$file" ]; then
                printf '%s\n' "$file"
              fi
            done
          )
          if [ "${#baseline_files[@]}" -eq 0 ]; then
            printf '[]\n' > /tmp/phase10a-base-eslint.json
            base_eslint_exit=0
          else
            pushd "/tmp/phase10a-main-baseline"
            "$GITHUB_WORKSPACE/node_modules/.bin/eslint" --format json \
              "${baseline_files[@]}" > /tmp/phase10a-base-eslint.json \
              2>/tmp/phase10a-base-eslint.stderr
            base_eslint_exit=$?
            popd
          fi
          set -e
          echo "eslint_compare: head_exit=${head_eslint_exit} base_exit=${base_eslint_exit}"
          node scripts/compare-eslint-baseline.mjs \
            /tmp/phase10a-head-eslint.json \
            /tmp/phase10a-base-eslint.json \
            "$GITHUB_WORKSPACE" \
            /tmp/phase10a-main-baseline
          echo "focused_eslint: manifest_files=${#manifest_files[@]} corrective_files=${#corrective_files[@]} unique_files=${#files[@]} duration_seconds=$(($(date +%s) - start)) exit_code=0 new_errors=0 new_warnings=0"

      - name: Run focused Phase 9-10A formatting certification
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node scripts/validate-phase10a-static-manifest.js
          mapfile -t files < <(
            node -e 'for (const file of require("./.github/p2-v2-phase10a-static-manifest.json")) console.log(file)'
          )
          npx prettier --check "${files[@]}"
          mapfile -t corrective_files < <(
            node scripts/resolve-p2-v2-certification-scope.mjs \
              --event "$EVENT_NAME" --base "$BASE_SHA" --kind prettier
          )
          for file in "${corrective_files[@]}"; do
            if npx prettier --check "$file" >/dev/null 2>&1; then
              continue
            fi
            if [ ! -f "/tmp/phase10a-main-baseline/$file" ]; then
              echo "New corrective file is not formatted: $file"
              npx prettier --check "$file"
              exit 1
            fi
            if "$GITHUB_WORKSPACE/node_modules/.bin/prettier" \
              --check "/tmp/phase10a-main-baseline/$file" >/dev/null 2>&1; then
              echo "Corrective file regressed from a formatted baseline: $file"
              npx prettier --check "$file"
              exit 1
            fi
            echo "Corrective file retains pre-existing formatting debt: $file"
          done
          git diff --check "$BASE_SHA"...HEAD
          echo "formatting: manifest_files=${#files[@]} corrective_files=${#corrective_files[@]} exit_code=0"

      - name: Create schema-push prerequisite
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE SEQUENCE rts_item_number_seq"

      - name: Create current application schema
        run: npx drizzle-kit push --force --config drizzle.app.config.ts

      - name: Restore migration-only schema baseline
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/0069_timekeeping_schema.sql

      - name: First safe-boot migration run
        env:
          SAFE_BOOT_MIGRATIONS_ONLY: 'true'
        run: npm run maintenance:safe-migrations

      - name: Capture first-run schema
        run: >-
          pg_dump "$DATABASE_URL" --schema-only --no-owner --no-privileges |
          sed '/^\\\(un\)\?restrict /d' > /tmp/schema-first.sql

      - name: Second safe-boot migration run
        env:
          SAFE_BOOT_MIGRATIONS_ONLY: 'true'
        run: npm run maintenance:safe-migrations

      - name: Prove second-run schema idempotency
        run: |
          pg_dump "$DATABASE_URL" --schema-only --no-owner --no-privileges |
            sed '/^\\\(un\)\?restrict /d' > /tmp/schema-second.sql
          diff --unified /tmp/schema-first.sql /tmp/schema-second.sql

      - name: Certify migration 0253 state-aware duplicate cleanup
        run: >-
          npx vitest run
          --config vitest.config.server.ts
          --no-file-parallelism
          server/__tests__/epochSoftwareValidationDuplicateCleanupPostgres.test.ts
          --reporter=verbose

      - name: Run EPOCH validation server regressions
        run: >-
          npx vitest run
          --config vitest.config.server.ts
          --no-file-parallelism
          server/__tests__/epochSoftwareValidationArchitecture.test.ts
          server/__tests__/epochSoftwareValidationDuplicateCleanupArchitecture.test.ts
          server/__tests__/epochSoftwareValidationIdempotencyArchitecture.test.ts
          server/__tests__/epochSoftwareValidationReadinessArchitecture.test.ts
          server/__tests__/epochSoftwareValidationRules.test.ts
          server/__tests__/epochSoftwareValidationWizardPhase1Architecture.test.ts
          server/__tests__/epochValidationResponsibilityDecision.test.ts
          --reporter=verbose

      - name: Run isolated PostgreSQL certification
        env:
          P2_V2_PRODUCTION_LAUNCH_ENABLED: 'true'
          DESIGN_PROJECT_CONFIGURATION_POSTGRES_CERTIFICATION: isolated_test
        run: >-
          npx vitest run
          --config vitest.config.server.ts
          --no-file-parallelism
          server/__tests__/p2V2PostgresCertification.test.ts
          server/__tests__/designProjectConfigurationSecurityPostgres.test.ts
          --reporter=verbose

      - name: Run Design Control PostgreSQL and lifecycle certification
        env:
          DESIGN_CONTROL_CLEAN_SCHEMA_CERTIFICATION: isolated_test
          DESIGN_PROJECT_CONFIGURATION_POSTGRES_CERTIFICATION: isolated_test
        run: >-
          npx vitest run
          --config vitest.config.server.ts
          --no-file-parallelism
          server/__tests__/designControlCleanSchemaPostgres.test.ts
          server/__tests__/designProjectConfigurationSecurityPostgres.test.ts
          server/__tests__/designControlAuthorityFoundation.test.ts
          server/__tests__/designControlAuthenticatedApprovals.test.ts
          server/__tests__/designControlFormTemplates.test.ts
          server/__tests__/designControlProductionReadiness.test.ts
          server/__tests__/designControlSchemaHardening.test.ts
          server/__tests__/designControlWorkspacePhase11.test.ts
          server/__tests__/designHistoryFiles.test.ts
          server/__tests__/engineeringChangeRequests.test.ts
          server/__tests__/engineeringChangeNotices.test.ts
          server/__tests__/postReleaseEngineeringReleases.test.ts
          server/__tests__/qmsDesignControlReleaseGate.test.ts
          --reporter=verbose

      - name: Run Design Control client regressions
        run: >-
          npx vitest run
          --config vitest.config.client.ts
          client/src/__tests__/designControlAuthority.client.test.ts
          client/src/__tests__/DesignProjectConfigurationWorkspace.component.test.tsx
          --reporter=verbose

      - name: Run exhaustive legacy preservation PostgreSQL certification
        run: >-
          npx vitest run
          --config vitest.config.server.ts
          server/__tests__/p2V2LegacyPreservationPostgres.test.ts
          --reporter=verbose

      - name: Run action-by-action legacy continuation PostgreSQL certification
        run: >-
          npx vitest run
          --config vitest.config.server.ts
          server/__tests__/p2V2LegacyContinuationPostgres.test.ts
          --reporter=verbose

      - name: Run safe snapshot mismatch reporting certification
        run: >-
          npx vitest run
          --config vitest.config.server.ts
          server/__tests__/legacySnapshotDiff.test.ts
          --reporter=verbose

      - name: Run controlled pilot PostgreSQL certification
        env:
          P2_V2_PILOT_ENVIRONMENT: isolated_test
        run: >-
          npx vitest run
          --config vitest.config.server.ts
          server/__tests__/p2V2PilotPostgresCertification.test.ts
          --reporter=verbose

      - name: Run Phase 1-9 focused server regressions
        run: >-
          npx vitest run
          --config vitest.config.server.ts
          server/__tests__/projectWorkflowVersion.test.ts
          server/__tests__/projectWorkflowRegistry.test.ts
          server/__tests__/projectWorkflowInstance.test.ts
          server/__tests__/projectWorkflowV2ReadModel.test.ts
          server/__tests__/projectClosingGate.test.ts
          server/__tests__/projectCommercialReview.test.ts
          server/__tests__/projectTechnicalConfigurationReview.test.ts
          server/__tests__/projectProductionPlanning.test.ts
          server/__tests__/projectWadAuthorization.test.ts
          server/__tests__/projectPreproductionReadiness.test.ts
          server/__tests__/projectP2Handoff.test.ts
          server/__tests__/projectProductionExecution.test.ts
          server/__tests__/projectQualityRelease.test.ts
          server/__tests__/projectShippingCloseout.test.ts
          server/__tests__/p2V2ProductionLaunchFeatureGate.test.ts
          --hookTimeout=30000
          --reporter=verbose

      - name: Run P2 V2 ten-stage component regressions
        run: >-
          npx vitest run
          --config vitest.config.client.ts
          client/src/__tests__/P2V2ProjectWorkflow.component.test.tsx
          client/src/__tests__/P2V2ProductionPlanning.component.test.tsx
          client/src/__tests__/P2V2WadAuthorization.component.test.tsx
          client/src/__tests__/P2V2PreproductionReadiness.component.test.tsx
          client/src/__tests__/P2V2ProductionExecution.component.test.tsx
          client/src/__tests__/P2V2QualityProductRelease.component.test.tsx
          client/src/__tests__/P2V2ShippingProjectCloseout.component.test.tsx
          client/src/__tests__/P2V2PilotControlCenter.component.test.tsx
          client/src/__tests__/DesignProjectConfigurationWorkspace.component.test.tsx
          --reporter=verbose

      - name: Run EPOCH validation component regressions
        run: >-
          npx vitest run
          --config vitest.config.client.ts
          client/src/__tests__/epochSoftwareValidationCreate.component.test.tsx
          client/src/__tests__/epochSoftwareValidationReadiness.component.test.tsx
          client/src/__tests__/epochSoftwareValidationWizardPhase1.component.test.tsx
          --reporter=verbose

  synthetic-pilot-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: synthetic_pilot
          POSTGRES_PASSWORD: synthetic_pilot_disposable_password
          POSTGRES_DB: epoch_p2_v2_synthetic_pilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synthetic_pilot -d epoch_p2_v2_synthetic_pilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://synthetic_pilot:synthetic_pilot_disposable_password@127.0.0.1:5432/epoch_p2_v2_synthetic_pilot
      NODE_ENV: test
      P2_V2_PILOT_ENVIRONMENT: isolated_test
      P2_V2_PRODUCTION_LAUNCH_ENABLED: 'true'
      P2_V2_SYNTHETIC_DATA_MARKER: SYNTHETIC_TEST_DATA_NOT_FOR_PRODUCTION
      P2_V2_OUTBOUND_EVIDENCE_FILE: /tmp/p2-v2-synthetic-outbound-attempts.log
      EMAIL_ENABLED: 'false'
      SMS_ENABLED: 'false'
      WEBHOOKS_ENABLED: 'false'
      SHIPPING_CARRIER_ENABLED: 'false'
      SHIPPING_LABELS_ENABLED: 'false'
      PURCHASING_OUTBOUND_ENABLED: 'false'
      EXTERNAL_UPLOADS_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install committed dependencies
        run: npm ci --ignore-scripts

      - name: Prove disposable isolation boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$P2_V2_PILOT_ENVIRONMENT" = "isolated_test"
          test "$P2_V2_PRODUCTION_LAUNCH_ENABLED" = "true"
          node - <<'NODE'
          const url = new URL(process.env.DATABASE_URL);
          if (url.hostname !== '127.0.0.1') throw new Error('Shared database host rejected');
          if (url.pathname !== '/epoch_p2_v2_synthetic_pilot') {
            throw new Error('Unexpected disposable database name');
          }
          console.log('database_host=127.0.0.1');
          console.log(`database_name=${url.pathname.slice(1)}`);
          console.log(`pilot_environment=${process.env.P2_V2_PILOT_ENVIRONMENT}`);
          console.log(`synthetic_marker=${process.env.P2_V2_SYNTHETIC_DATA_MARKER}`);
          console.log('shared_database_contacted=false');
          NODE
          psql "$DATABASE_URL" -Atc \
            "SELECT 'postgresql_version=' || current_setting('server_version')"
          : > "$P2_V2_OUTBOUND_EVIDENCE_FILE"

      - name: Create supported application schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "CREATE SEQUENCE rts_item_number_seq"
          npx drizzle-kit push --force --config drizzle.app.config.ts
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f migrations/0069_timekeeping_schema.sql

      - name: Run complete safe boot twice and prove schema idempotency
        shell: bash
        env:
          SAFE_BOOT_MIGRATIONS_ONLY: 'true'
        run: |
          set -euo pipefail
          npm run maintenance:safe-migrations
          pg_dump "$DATABASE_URL" --schema-only --no-owner --no-privileges |
            sed '/^\\\(un\)\?restrict /d' > /tmp/synthetic-schema-first.sql
          npm run maintenance:safe-migrations
          pg_dump "$DATABASE_URL" --schema-only --no-owner --no-privileges |
            sed '/^\\\(un\)\?restrict /d' > /tmp/synthetic-schema-second.sql
          diff --unified \
            /tmp/synthetic-schema-first.sql \
            /tmp/synthetic-schema-second.sql
          node - <<'NODE'
          const { readFileSync } = require('node:fs');
          const source = readFileSync(
            'server/scripts/migrations/runSafeBootMigrations.ts',
            'utf8'
          );
          const ordered = [
            '0232_p2_v2_controlled_pilot_readiness.sql',
            '0233_part_specification_sheet_control.sql',
            '0234_epoch_validation_readiness_controls.sql',
          ];
          let cursor = -1;
          for (const migration of ordered) {
            const next = source.indexOf(migration);
            if (next <= cursor) throw new Error(`Non-deterministic migration order: ${migration}`);
            cursor = next;
          }
          console.log(`safe_boot_order=${ordered.join(' -> ')}`);
          console.log('safe_boot_replay=passed');
          console.log('schema_idempotency=passed');
          NODE

      - name: Certify migration 0253 state-aware duplicate cleanup
        run: >-
          npx vitest run
          --config vitest.config.server.ts
          --no-file-parallelism
          server/__tests__/epochSoftwareValidationDuplicateCleanupPostgres.test.ts
          --reporter=verbose

      - name: Run existing Phase 10A PostgreSQL lifecycle
        env:
          NODE_OPTIONS: --require=./scripts/p2-v2-synthetic-outbound-guard.cjs
        run: >-
          npx vitest run
          --config vitest.config.server.ts
          server/__tests__/p2V2PostgresCertification.test.ts
          --reporter=verbose

      - name: Run exact Phase 10B synthetic pilot authorization
        env:
          NODE_OPTIONS: --require=./scripts/p2-v2-synthetic-outbound-guard.cjs
        run: >-
          npx vitest run
          --config vitest.config.server.ts
          server/__tests__/p2V2PilotPostgresCertification.test.ts
          --reporter=verbose

      - name: Run Phase 9A-9C and isolation regressions
        env:
          NODE_OPTIONS: --require=./scripts/p2-v2-synthetic-outbound-guard.cjs
        run: >-
          npx vitest run
          --config vitest.config.server.ts
          server/__tests__/projectProductionExecution.test.ts
          server/__tests__/projectQualityRelease.test.ts
