name: P2 Manufactured Component Issue PostgreSQL Certification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'migrations/0307_p2_manufactured_component_issue_genealogy.sql'
      - 'server/src/services/p2ManufacturedComponentIssueService.ts'
      - 'server/src/routes/p2ManufacturingWorkOrders.ts'
      - 'server/__tests__/p2ManufacturedComponentIssueGenealogy.test.ts'
      - '.github/workflows/p2-manufactured-component-issue-postgres.yml'
  push:
    branches: [codex/p2-manufactured-component-issue-genealogy]

jobs:
  certify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: phase11_cert
          POSTGRES_PASSWORD: disposable_phase11_password
          POSTGRES_DB: epoch_phase11_certification
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U phase11_cert -d epoch_phase11_certification"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://phase11_cert:disposable_phase11_password@127.0.0.1:5432/epoch_phase11_certification
      NODE_ENV: test
      SAFE_BOOT_MIGRATIONS_ONLY: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Prove isolation and disabled gates
        run: |
          test "$(node -e "console.log(new URL(process.env.DATABASE_URL).hostname)")" = 127.0.0.1
          test -z "${P2_MANUFACTURED_COMPONENT_ISSUE_READS_ENABLED:-}"
          test -z "${P2_MANUFACTURED_COMPONENT_ISSUE_WRITES_ENABLED:-}"
      - name: Focused Phase 10-11 contracts
        run: |
          npx vitest run --config vitest.config.server.ts server/__tests__/p2ManufacturedOutputGenealogyFoundation.test.ts server/__tests__/p2ManufacturedOutputCustodyFoundation.test.ts server/__tests__/p2ManufacturedComponentIssueGenealogy.test.ts
      - name: Syntax and hygiene
        run: |
          npx esbuild server/src/services/p2ManufacturedComponentIssueService.ts server/src/routes/p2ManufacturingWorkOrders.ts --platform=node --format=esm --outdir=/tmp/p2-phase11-ts
          npx eslint server/src/services/p2ManufacturedComponentIssueService.ts server/__tests__/p2ManufacturedComponentIssueGenealogy.test.ts --max-warnings 0
          npx prettier --check server/src/services/p2ManufacturedComponentIssueService.ts server/src/routes/p2ManufacturingWorkOrders.ts server/__tests__/p2ManufacturedComponentIssueGenealogy.test.ts
          git diff --check
      - name: Clean, populated-compatible, and replay-safe migration
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE TYPE inventory_ledger_transaction_type AS ENUM ('RECEIVE','ISSUE','RETURN','TRANSFER','MOVE','RESERVE','UNRESERVE','CONSUME','ADJUST','SCRAP','SPLIT','MERGE','COUNT_ADJUSTMENT','STATUS_CHANGE','QUARANTINE','RELEASE','EXPIRE','REVERSAL');
          CREATE TABLE inventory_items(id integer PRIMARY KEY,ag_part_number text UNIQUE);
          CREATE TABLE projects(id uuid PRIMARY KEY);
          CREATE TABLE production_work_orders(id uuid PRIMARY KEY);
          CREATE TABLE travelers(id varchar(255) PRIMARY KEY);
          CREATE TABLE p2_frozen_production_demand_nodes(id uuid PRIMARY KEY);
          CREATE TABLE p2_manufacturing_work_order_authorities(id uuid PRIMARY KEY,production_work_order_id uuid,traveler_id varchar(255));
          CREATE TABLE p2_manufacturing_work_order_material_requirements(id uuid PRIMARY KEY,successor_authority_id uuid REFERENCES p2_manufacturing_work_order_authorities(id),inventory_item_id integer,issued_quantity numeric,required_quantity numeric,status text);
          CREATE TABLE p2_manufactured_output_authorities(id uuid PRIMARY KEY);
          CREATE TABLE inventory_transaction_ledger(id uuid PRIMARY KEY DEFAULT gen_random_uuid(),transaction_type inventory_ledger_transaction_type NOT NULL,inventory_item_id integer,ag_part_number text,location_id text,quantity_delta numeric,quantity_before numeric,quantity_after numeric,unit_of_measure text,status_before text,status_after text,performed_by_user_id integer,performed_by_display_name text,approved_by_user_id integer,approved_by_display_name text,project_id uuid,production_work_order_id uuid,traveler_id varchar(255),reason_code text,notes text,source_module text,source_record_id text,event_hash text,reversed_transaction_id uuid,metadata jsonb);
          CREATE TABLE p2_manufactured_output_custodies(id uuid PRIMARY KEY,output_authority_id uuid REFERENCES p2_manufactured_output_authorities(id),inventory_item_id integer,output_identity text,traceability_mode text,unit_of_measure text,location_id text,custody_status text,received_quantity numeric,issued_quantity numeric,reversed_quantity numeric,available_quantity numeric,receipt_ledger_entry_id uuid);
          CREATE TABLE perm_capabilities(id serial PRIMARY KEY,key text UNIQUE,description text,category text);
          CREATE TABLE perm_roles(id serial PRIMARY KEY,name text UNIQUE);
          CREATE TABLE perm_role_capabilities(role_id integer,capability_id integer,UNIQUE(role_id,capability_id));
          INSERT INTO perm_roles(name) VALUES ('ADMIN'),('OWNER'),('MANAGER'),('INVENTORY_MANAGER');
          CREATE TABLE historical_marker(id integer PRIMARY KEY,payload text);
          INSERT INTO historical_marker VALUES (1,'preserve-me');
          SQL
          before="$(psql "$DATABASE_URL" -Atc "SELECT count(*)||':'||md5(string_agg(id||payload,',' ORDER BY id)) FROM historical_marker")"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/0307_p2_manufactured_component_issue_genealogy.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/0307_p2_manufactured_component_issue_genealogy.sql
          after="$(psql "$DATABASE_URL" -Atc "SELECT count(*)||':'||md5(string_agg(id||payload,',' ORDER BY id)) FROM historical_marker")"
          test "$before" = "$after"
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM perm_role_capabilities prc JOIN perm_roles r ON r.id=prc.role_id WHERE r.name IN ('MANAGER','INVENTORY_MANAGER')")" = 0
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT to_regclass('p2_manufactured_component_issues'),to_regclass('p2_manufactured_component_genealogy_edges'),to_regclass('p2_manufactured_component_issue_reversals')"
